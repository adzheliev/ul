version: 2

models:
  - name: fact_price
    description: Accepted price in RUB with one body group for scoring.
    columns:
      - name: price_id
        tests: [unique, not_null]
      - name: price_rub
        tests: [not_null]
      - name: body_group
        tests: [not_null]
      - name: recomputed_outlier
        description: >
          Extra MarkOutlierPrices flag. Tukey 1.5 IQR on raw price or P5–P95
          on raw price per kilometre, inside a price_group_id of at least four
          accepted facts. Absence of a group mark is false. Not a feature.
  - name: dim_city
    description: One row per gc_id. The surviving row is the smallest cities.id.
    columns:
      - name: gc_id
        tests: [unique, not_null]
  - name: bridge_price_body_group
    description: One row per price and standardised body group.
