[project]
name = "smartlogistics"
version = "0.1.0"
description = "Layered tariff warehouse, quality gates, and batch price scoring"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "catboost>=1.2.7",
    "clickhouse-connect>=0.8.16",
    "dbt-core>=1.9,<2",
    "dbt-postgres>=1.9,<2",
    "great-expectations>=1.5,<2",
    "numpy>=2.1",
    "pandas>=2.2",
    "pandera>=0.22",
    "psycopg[binary]>=3.2",
    "pydantic>=2.10",
    "pydantic-settings>=2.6",
    "scikit-learn>=1.5",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["etl", "ml"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["etl", "ml", "dags", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "N"]

[tool.ruff.lint.isort]
known-first-party = ["etl", "ml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "integration: requires Postgres and ClickHouse",
]

[tool.coverage.run]
source = ["etl", "ml"]
