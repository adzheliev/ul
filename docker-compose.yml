name: smartlogistics

x-airflow-env: &airflow-env
  AIRFLOW__CORE__EXECUTOR: LocalExecutor
  AIRFLOW__CORE__LOAD_EXAMPLES: "false"
  AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "false"
  AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:${AIRFLOW_DB_PASSWORD:-airflow}@postgres:5432/airflow
  PYTHONPATH: /opt/airflow/project
  DBT_PROFILES_DIR: /opt/airflow/project/dbt
  POSTGRES_HOST: postgres
  POSTGRES_PORT: "5432"
  POSTGRES_DB: deals_bigdata
  POSTGRES_USER: etl
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-etl}
  CLICKHOUSE_HOST: clickhouse
  CLICKHOUSE_PORT: "8123"
  CLICKHOUSE_DB: mart
  CLICKHOUSE_USER: ${CLICKHOUSE_USER:-default}
  CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-clickhouse}
  AS_OF: ${AS_OF:-2026-10-26}
  ML_SEED: ${ML_SEED:-20261026}
  ML_THREAD_COUNT: ${ML_THREAD_COUNT:-4}
  WINDOW_START: ${WINDOW_START:-2023-01-01}
  WINDOW_END: ${WINDOW_END:-2027-12-31}

x-app-env: &app-env
  POSTGRES_HOST: postgres
  POSTGRES_PORT: "5432"
  POSTGRES_DB: deals_bigdata
  POSTGRES_USER: etl
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-etl}
  CLICKHOUSE_HOST: clickhouse
  CLICKHOUSE_PORT: "8123"
  CLICKHOUSE_DB: mart
  CLICKHOUSE_USER: ${CLICKHOUSE_USER:-default}
  CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-clickhouse}
  AS_OF: ${AS_OF:-2026-10-26}
  ML_SEED: ${ML_SEED:-20261026}
  ML_THREAD_COUNT: ${ML_THREAD_COUNT:-4}
  WINDOW_START: ${WINDOW_START:-2023-01-01}
  WINDOW_END: ${WINDOW_END:-2027-12-31}

services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD:-postgres}
      POSTGRES_DB: deals_bigdata
      ETL_PASSWORD: ${POSTGRES_PASSWORD:-etl}
      AIRFLOW_DB_PASSWORD: ${AIRFLOW_DB_PASSWORD:-airflow}
      SUPERSET_DB_PASSWORD: ${SUPERSET_DB_PASSWORD:-superset}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./sql/schema.sql:/docker-entrypoint-initdb.d/10_schema.sql:ro
      - ./sql/synthetic.sql:/docker-entrypoint-initdb.d/20_synthetic.sql:ro
      - ./docker/postgres/init.sh:/docker-entrypoint-initdb.d/30_init.sh:ro
      - ./sql/dwh:/bootstrap/dwh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d deals_bigdata && psql -U postgres -d deals_bigdata -tAc \"SELECT to_regclass('dq.quarantine_prices')\" | grep -q quarantine_prices"]
      interval: 15s
      timeout: 5s
      retries: 40
      start_period: 900s
    ports:
      - "5432:5432"

  clickhouse:
    image: clickhouse/clickhouse-server:24.12
    environment:
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-default}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-clickhouse}
      CLICKHOUSE_DB: mart
    volumes:
      - chdata:/var/lib/clickhouse
      - ./sql/clickhouse/10_mart.sql:/docker-entrypoint-initdb.d/10_mart.sql:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "-O-", "http://127.0.0.1:8123/ping"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
    ports:
      - "8123:8123"

  pipeline:
    build:
      context: .
      dockerfile: docker/app/Dockerfile
      target: app
    environment: *app-env
    depends_on:
      postgres:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
    restart: "no"

  airflow-init:
    build:
      context: .
      dockerfile: docker/app/Dockerfile
      target: airflow
    environment:
      <<: *airflow-env
      AIRFLOW_ADMIN_USER: ${AIRFLOW_ADMIN_USER:-admin}
      AIRFLOW_ADMIN_PASSWORD: ${AIRFLOW_ADMIN_PASSWORD:-admin}
      AIRFLOW_ADMIN_EMAIL: ${AIRFLOW_ADMIN_EMAIL:-admin@example.com}
    volumes: &airflow-volumes
      - ./etl:/opt/airflow/project/etl:ro
      - ./ml:/opt/airflow/project/ml:ro
      - ./dbt:/opt/airflow/project/dbt:ro
      - ./sql:/opt/airflow/project/sql:ro
      - ./dags:/opt/airflow/dags:ro
      - ./artifacts:/opt/airflow/project/artifacts
    entrypoint: ["bash", "-c"]
    command:
      - |
        set -euo pipefail
        airflow db migrate
        airflow users create \
          --username "$$AIRFLOW_ADMIN_USER" \
          --password "$$AIRFLOW_ADMIN_PASSWORD" \
          --firstname Admin \
          --lastname User \
          --role Admin \
          --email "$$AIRFLOW_ADMIN_EMAIL" || true
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  airflow-scheduler:
    build:
      context: .
      dockerfile: docker/app/Dockerfile
      target: airflow
    command: ["airflow", "scheduler"]
    environment: *airflow-env
    volumes: *airflow-volumes
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    restart: unless-stopped

  airflow-webserver:
    build:
      context: .
      dockerfile: docker/app/Dockerfile
      target: airflow
    command: ["airflow", "webserver"]
    environment: *airflow-env
    volumes: *airflow-volumes
    ports:
      - "8080:8080"
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    restart: unless-stopped

  superset-init:
    build:
      context: .
      dockerfile: docker/superset/Dockerfile
    environment: &superset-env
      SUPERSET_SECRET_KEY: ${SUPERSET_SECRET_KEY:-local-demo-secret}
      SUPERSET_CONFIG_PATH: /app/pythonpath/superset_config.py
      SUPERSET_METADATA_URI: postgresql+psycopg2://superset:${SUPERSET_DB_PASSWORD:-superset}@postgres:5432/superset
      SUPERSET_USER: ${SUPERSET_USER:-admin}
      SUPERSET_PASSWORD: ${SUPERSET_PASSWORD:-admin}
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-default}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-clickhouse}
    volumes: &superset-volumes
      - ./docker/superset/superset_config.py:/app/pythonpath/superset_config.py:ro
      - ./docker/superset/bootstrap.py:/bootstrap/bootstrap.py:ro
    entrypoint: ["bash", "-c"]
    command:
      - |
        set -euo pipefail
        superset db upgrade
        superset fab create-admin \
          --username "$$SUPERSET_USER" \
          --firstname Admin \
          --lastname User \
          --email admin@example.com \
          --password "$$SUPERSET_PASSWORD" || true
        superset init
        python /bootstrap/bootstrap.py
    depends_on:
      postgres:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
      pipeline:
        condition: service_completed_successfully
    restart: "no"

  superset:
    build:
      context: .
      dockerfile: docker/superset/Dockerfile
    environment: *superset-env
    volumes: *superset-volumes
    ports:
      - "8088:8088"
    depends_on:
      superset-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8088/health"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 90s
    restart: unless-stopped

volumes:
  pgdata:
  chdata:
